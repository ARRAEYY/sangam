<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Sangam Emblem -->
  <g transform="translate(10, 10)">
    <!-- Central donut ring -->
    <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="12" fill="none" />
    
    <!-- Outer segmented concentric arcs -->
    <!-- Top-left segment -->
    <path d="M 50 4 A 46 46 0 0 0 4 50" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    
    <!-- Bottom segment -->
    <path d="M 4 50 A 46 46 0 0 0 78 86" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    
    <!-- Top-right outer notch arc -->
    <path d="M 50 4 A 46 46 0 0 1 96 50" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    <path d="M 96 50 A 46 46 0 0 1 78 86" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
    
    <!-- Inner concentric accent notch -->
    <path d="M 14 36 A 40 40 0 0 0 14 64" stroke="currentColor" stroke-width="4" stroke-linecap="square" />
    <path d="M 86 36 A 40 40 0 0 1 86 64" stroke="currentColor" stroke-width="4" stroke-linecap="square" />
  </g>
  
  <!-- Sangam Wordmark -->
  <text x="135" y="78" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="currentColor" letter-spacing="-1.5">Sangam</text>
</svg>
